# Board: Generic ESP8266 Board (Generic)
# Definition: definitions/boards/generic-esp8266/manifest.yaml

esphome:
  name: smartcharger
  friendly_name: smartcharger

esp8266:
  board: esp01_1m

# logger désactivé sur le port série car GPIO3 (RX) sert a la communication ETEK
logger:
  baud_rate: 0 # Désactive l'écriture sur le port série (RX/TX)

api:
  encryption:
    key: !secret smartcharger__encryption_key

ota:
  - platform: esphome

# ==========================================
#  SERVEUR WEB EMBARQUÉ
# ==========================================

web_server:
  port: 80

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: SmartCharger
    password: SmartCharger

# --- 1. COMMUNICATION UART / MODBUS ---
uart:
  - id: uart_modbus
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 9600

modbus:
  id: modbus_bus
  uart_id: uart_modbus
  flow_control_pin: GPIO0 # Placé sous modbus (gère le DE/RE du MAX485)

modbus_controller:
  - id: borne_charge
    address: 255
    modbus_id: modbus_bus
    update_interval: 2s

globals:
  - id: consigne_ampere
    type: int
    restore_value: true
    initial_value: '6'
  - id: borne_est_verrouillee
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: derniere_maj_tic
    type: uint32_t
    restore_value: false
    initial_value: '0'

# --- 2. CONTRÔLES ---
number:
  # Registre Modbus 109 : Écriture brute via l'équation ((x * 1000) / 6)
  - platform: modbus_controller
    modbus_controller_id: borne_charge
    name: "Courant de charge VE"
    id: consigne_modbus
    icon: "mdi:ev-station"
    register_type: holding
    address: 109
    value_type: U_WORD
    min_value: 6
    max_value: 32
    step: 1
    lambda: |-
      int a = (int)std::round(x * 6.0f / 1000.0f);
      id(consigne_ampere) = a;
      return (float)a;
    write_lambda: |-
      id(consigne_ampere) = (int)std::round(x);
      return std::round(x * 1000.0f / 6.0f);

  # Registre Modbus 89 : Commandes de déblocage (1) / blocage (2)
  - platform: modbus_controller
    modbus_controller_id: borne_charge
    name: "Commande verrouillage borne"
    id: commande_verrou_modbus
    internal: true
    register_type: holding
    address: 89
    value_type: U_WORD

  # Curseur : Courant limite de charge (Cible MAX)
  - platform: template
    name: "Courant limite de charge"
    id: courant_limite
    unit_of_measurement: "A"
    min_value: 6
    max_value: 32
    step: 1
    initial_value: 32
    optimistic: true
    restore_value: true

  # Curseur : Courant dégradé (Consigne minimale / secours)
  - platform: template
    name: "Courant dégradé"
    id: courant_degrade
    unit_of_measurement: "A"
    min_value: 6
    max_value: 32
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true

switch:
  - platform: template
    name: "Heure creuse uniquement"
    id: hc_uniquement
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# --- 3. CAPTEURS TIC (HA) & BORNE ---
text_sensor:
  - platform: homeassistant
    entity_id: sensor.moduletic_ptec
    id: tic_ptec
    internal: true

  - platform: template
    name: "Statut de la borne"
    id: statut_borne_texte
    icon: "mdi:ev-station"
    lambda: |-
      if (std::isnan(id(etat_borne).state)) {
        return std::string("Indisponible");
      }
      if (id(borne_est_verrouillee)) {
        return std::string("Bloqué");
      }
      int etat = (int) id(etat_borne).state;
      switch (etat) {
        case 1: return std::string("VE déconnecté");
        case 3: 
        case 4: return std::string("VE connecté");
        case 5: return std::string("VE en charge");
        default: return std::string("Défaut");
      }

sensor:
  # Capteurs Triphasés (IINST1, IINST2, IINST3)
  - platform: homeassistant
    entity_id: sensor.moduletic_iinst1
    id: tic_iinst1
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: homeassistant
    entity_id: sensor.moduletic_iinst2
    id: tic_iinst2
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: homeassistant
    entity_id: sensor.moduletic_iinst3
    id: tic_iinst3
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: homeassistant
    entity_id: sensor.moduletic_isousc
    id: tic_isousc
    internal: true

  - platform: homeassistant
    entity_id: sensor.moduletic_hchp
    id: tic_hchp
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: homeassistant
    entity_id: sensor.moduletic_hchc
    id: tic_hchc
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: modbus_controller
    modbus_controller_id: borne_charge
    id: etat_borne
    internal: true
    register_type: holding
    address: 141
    value_type: U_WORD
    on_value:
      then:
        - component.update: statut_borne_texte
        - lambda: |-
            static int ancien_etat = -1;
            int nouvel_etat = (int) x;

            if (nouvel_etat == 5 && ancien_etat != 5) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            } else if (nouvel_etat != 5 && ancien_etat == 5) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            } else if (nouvel_etat != 5 && id(consigne_ampere) < 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }

            ancien_etat = nouvel_etat;

# --- 4. RÉGULATION ET DÉLESTAGE DYNAMIQUE TRIPHASÉ ---
interval:
  - interval: 5s
    then:
      - script.execute: boucle_rampe_charge

script:
  - id: boucle_rampe_charge
    mode: single
    then:
      - lambda: |-
          // 1. Analyse Heures Creuses / Heures Pleines et Verrouillage
          bool switch_hc = id(hc_uniquement).state;
          std::string periode = id(tic_ptec).state;
          bool is_hc = (periode.find("HC") != std::string::npos);

          if (switch_hc && !is_hc) {
            if (!id(borne_est_verrouillee)) {
              id(commande_verrou_modbus).make_call().set_value(2).perform();
              id(borne_est_verrouillee) = true;
              id(statut_borne_texte).publish_state("Bloqué");
            }
            if (id(consigne_ampere) != 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }
            return;
          } else {
            if (id(borne_est_verrouillee)) {
              id(commande_verrou_modbus).make_call().set_value(1).perform();
              id(borne_est_verrouillee) = false;

              if ((int)id(etat_borne).state == 5 || (int)id(etat_borne).state == 4) {
                id(consigne_ampere) = 6;
                id(consigne_modbus).make_call().set_value(6.0f).perform();
              }
            }
          }

          // 2. Traitement uniquement si la borne est en charge (Statut 5)
          int statut = (int)id(etat_borne).state;
          if (statut != 5) {
            if (id(consigne_ampere) != 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }
            return;
          }

          // 3. Récupération des données TIC Triphasé
          float iinst1 = id(tic_iinst1).state;
          float iinst2 = id(tic_iinst2).state;
          float iinst3 = id(tic_iinst3).state;
          float isousc = id(tic_isousc).state;

          // VÉRIFICATION DÉFAUT TIC (Valeurs non numériques OU absentes depuis + de 30s)
          bool tic_invalide = std::isnan(iinst1) || std::isnan(iinst2) || std::isnan(iinst3) || std::isnan(isousc) || isousc == 0;
          bool tic_timeout = (id(derniere_maj_tic) == 0) || ((millis() - id(derniere_maj_tic)) > 30000);

          int val_courant_degrade = (int)id(courant_degrade).state;
          if (val_courant_degrade < 6) val_courant_degrade = 6;

          if (tic_invalide || tic_timeout) {
            if (id(consigne_ampere) != val_courant_degrade) {
              id(consigne_ampere) = val_courant_degrade;
              id(consigne_modbus).make_call().set_value((float)val_courant_degrade).perform();
            }
            return;
          }

          // --- RECHERCHE DE LA PHASE LA PLUS CHARGÉE ---
          float iinst_max = std::max({iinst1, iinst2, iinst3});

          // --- SÉCURITÉ URGENCE STRICTE : SURCHARGE SEUIL HAUT (IINST_MAX >= ISOUSC + 5A) ---
          if (iinst_max >= (isousc + 5.0f)) {
            if (id(consigne_ampere) != 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }
            return;
          }

          const int MINIMAL_CHARGE_CURRENT = 6;
          const int MAXIMAL_CHARGE_CURRENT = 32;
          const float BIG_GAP_GRID_CURRENT = 3.0f;
          const float NULL_GAP_GRID_CURRENT = 0.0f;

          // Marge disponible basée sur la phase la plus contrainte
          float available_current = isousc - iinst_max;
          int current_charge = id(consigne_ampere);

          if (current_charge < 6) {
            current_charge = 6;
          }

          // --- ASSERVISSEMENT DE LA MONTEE / DESCENTE ---
          if (available_current < -BIG_GAP_GRID_CURRENT) {
            current_charge = MINIMAL_CHARGE_CURRENT;
          } 
          else if (available_current < NULL_GAP_GRID_CURRENT) {
            if (current_charge > MINIMAL_CHARGE_CURRENT) {
              current_charge -= 1;
            }
          } 
          else if (available_current == NULL_GAP_GRID_CURRENT) {
            // Ne rien faire
          } 
          else if (available_current < BIG_GAP_GRID_CURRENT) {
            if (current_charge < MAXIMAL_CHARGE_CURRENT) {
              current_charge += 1;
            }
          } 
          else {
            if (current_charge < MAXIMAL_CHARGE_CURRENT) {
              current_charge += 2;
            }
          }

          // --- LIMITATIONS ET APLATS (GARANTIE STRICTE [6A - LIMITE]) ---
          int limite_user = (int)id(courant_limite).state;
          if (current_charge > limite_user) current_charge = limite_user;
          if (current_charge > (int)isousc) current_charge = (int)isousc;
          if (current_charge > MAXIMAL_CHARGE_CURRENT) current_charge = MAXIMAL_CHARGE_CURRENT;
          if (current_charge < MINIMAL_CHARGE_CURRENT) current_charge = MINIMAL_CHARGE_CURRENT;

          // Envoi de la consigne si elle varie
          if (current_charge != id(consigne_ampere)) {
            id(consigne_ampere) = current_charge;
            id(consigne_modbus).make_call().set_value((float)current_charge).perform();
          }

# ==========================================
#  BOUTON DE RESET WI-FI SUR GPIO2
# ==========================================

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: false
      inverted: false
    name: "Bouton Reset Wifi"
    internal: true
    on_press:
      then:
        - lambda: |-
            esphome::wifi::global_wifi_component->save_wifi_sta("", "");
        - button.press: reboot_button

button:
  - platform: restart
    id: reboot_button
    name: "Redémarrer"
    internal: true