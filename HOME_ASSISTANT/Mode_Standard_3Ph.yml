# Board: Generic ESP8266 Board (Generic)
# Definition: definitions/boards/generic-esp8266/manifest.yaml

esphome:
  name: smartcharger
  friendly_name: smartcharger

esp8266:
  board: esp01_1m

# Désactivation du logger série (car RX/TX gèrent le Modbus)
logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: !secret smartcharger__encryption_key

ota:
  - platform: esphome

# Horloge réseau pour obtenir l'heure courante
time:
  - platform: homeassistant
    id: esptime

# ==========================================
#  SERVEUR WEB EMBARQUÉ
# ==========================================

web_server:
  port: 80

captive_portal:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: SmartCharger
    password: SmartCharger

# --- 1. COMMUNICATION UART / MODBUS ---
uart:
  - id: uart_modbus
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 9600

modbus:
  id: modbus_bus
  uart_id: uart_modbus
  flow_control_pin: GPIO0 # Placé sous modbus (gère le DE/RE du MAX485)

modbus_controller:
  - id: borne_charge
    address: 255
    modbus_id: modbus_bus
    update_interval: 2s

globals:
  - id: consigne_ampere
    type: int
    restore_value: true
    initial_value: '6'
  - id: borne_est_verrouillee
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: derniere_maj_tic
    type: uint32_t
    restore_value: false
    initial_value: '0'

# --- 2. CONTRÔLES ---
number:
  # Registre Modbus 109 : Écriture brute via l'équation ((x * 1000) / 6)
  - platform: modbus_controller
    modbus_controller_id: borne_charge
    name: "Courant de charge VE"
    id: consigne_modbus
    icon: "mdi:ev-station"
    register_type: holding
    address: 109
    value_type: U_WORD
    min_value: 6
    max_value: 32
    step: 1
    lambda: |-
      int a = (int)std::round(x * 6.0f / 1000.0f);
      id(consigne_ampere) = a;
      return (float)a;
    write_lambda: |-
      id(consigne_ampere) = (int)std::round(x);
      return std::round(x * 1000.0f / 6.0f);

  # Registre Modbus 89 : Commandes de déblocage (1) / blocage (2)
  - platform: modbus_controller
    modbus_controller_id: borne_charge
    name: "Commande verrouillage borne"
    id: commande_verrou_modbus
    internal: true
    register_type: holding
    address: 89
    value_type: U_WORD

  # Curseur : Courant limite de charge (Cible MAX)
  - platform: template
    name: "Courant limite de charge"
    id: courant_limite
    unit_of_measurement: "A"
    min_value: 6
    max_value: 32
    step: 1
    initial_value: 32
    optimistic: true
    restore_value: true

  # Curseur : Courant dégradé (Consigne minimale / secours)
  - platform: template
    name: "Courant dégradé"
    id: courant_degrade
    unit_of_measurement: "A"
    min_value: 6
    max_value: 32
    step: 1
    initial_value: 6
    optimistic: true
    restore_value: true

  # Config Plage Horaire Solaire (Heures uniquement)
  - platform: template
    name: "Heure début charge solaire"
    id: solaire_heure_debut
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 9
    optimistic: true
    restore_value: true

  - platform: template
    name: "Heure fin charge solaire"
    id: solaire_heure_fin
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 18
    optimistic: true
    restore_value: true

switch:
  - platform: template
    name: "Charge solaire"
    id: charger_solaire
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "HC Standards (HC/HP)"
    id: hc_standard
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "HC Jours Bleus"
    id: hc_bleu
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "HC Jours Blancs"
    id: hc_blanc
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "HC Jours Rouges"
    id: hc_rouge
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Heures Super Creuses"
    id: hc_super
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "HC Weekends"
    id: hc_weekend
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "HC Mercredis"
    id: hc_mercredi
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# --- 3. CAPTEURS TIC (HA) & BORNE ---
text_sensor:
  - platform: homeassistant
    entity_id: sensor.moduletic_ltarf
    id: tic_ltarf
    internal: true

  - platform: template
    name: "Statut de la borne"
    id: statut_borne_texte
    icon: "mdi:ev-station"
    lambda: |-
      if (std::isnan(id(etat_borne).state)) {
        return std::string("Indisponible");
      }
      if (id(borne_est_verrouillee)) {
        return std::string("Bloqué");
      }
      int etat = (int) id(etat_borne).state;
      switch (etat) {
        case 1: return std::string("VE déconnecté");
        case 3: 
        case 4: return std::string("VE connecté");
        case 5: return std::string("VE en charge");
        default: return std::string("Défaut");
      }

sensor:
  # Monophasé TIC Standard
  - platform: homeassistant
    entity_id: sensor.moduletic_irms1
    id: tic_irms1
    internal: true
    
  - platform: homeassistant
    entity_id: sensor.moduletic_irms2
    id: tic_irms2
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.moduletic_irms3
    id: tic_irms3
    internal: true

  - platform: homeassistant
    entity_id: sensor.moduletic_urms1
    id: tic_urms1
    internal: true
  
  - platform: homeassistant
    entity_id: sensor.moduletic_urms2
    id: tic_urms2
    internal: true
    
  - platform: homeassistant
    entity_id: sensor.moduletic_urms3
    id: tic_urms3
    internal: true

  - platform: homeassistant
    entity_id: sensor.moduletic_pcoup
    id: tic_pcoup
    internal: true

  - platform: homeassistant
    entity_id: sensor.moduletic_sinsts
    id: tic_sinsts
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();
    
  - platform: homeassistant
    entity_id: sensor.moduletic_sinsti
    id: tic_sinsti
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: homeassistant
    entity_id: sensor.moduletic_east
    id: tic_east
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: homeassistant
    entity_id: sensor.moduletic_eait
    id: tic_eait
    internal: true
    on_value:
      then:
        - lambda: |-
            id(derniere_maj_tic) = millis();

  - platform: modbus_controller
    modbus_controller_id: borne_charge
    id: etat_borne
    internal: true
    register_type: holding
    address: 141
    value_type: U_WORD
    on_value:
      then:
        - component.update: statut_borne_texte
        - lambda: |-
            static int ancien_etat = -1;
            int nouvel_etat = (int) x;

            if (nouvel_etat == 5 && ancien_etat != 5) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            } else if (nouvel_etat != 5 && ancien_etat == 5) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            } else if (nouvel_etat != 5 && id(consigne_ampere) < 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }

            ancien_etat = nouvel_etat;

# --- 4. RÉGULATION ET DÉLESTAGE DYNAMIQUE MONOPHASÉ ---
interval:
  - interval: 4s
    then:
      - script.execute: boucle_rampe_charge

script:
  - id: boucle_rampe_charge
    mode: single
    then:
      - lambda: |-
          // 1. Analyse de l'état des switches Heures Creuses et Plage Solaire
          bool au_moins_un_switch_hc_actif = id(hc_standard).state || id(hc_bleu).state || id(hc_blanc).state ||
                                              id(hc_rouge).state || id(hc_super).state || id(hc_weekend).state ||
                                              id(hc_mercredi).state;

          bool mode_solaire_actif = id(charger_solaire).state;
          bool charge_autorisee = true;
          std::string ltarf = id(tic_ltarf).state;

          // VÉRIFICATION DE LA PLAGE HORAIRE EN MODE SOLAIRE (HEURES SEULEMENT)
          if (mode_solaire_actif) {
            auto time_now = id(esptime).now();
            if (time_now.is_valid()) {
              int heure_actuelle = time_now.hour;
              int heure_debut = (int)id(solaire_heure_debut).state;
              int heure_fin = (int)id(solaire_heure_fin).state;

              bool dans_plage = false;
              if (heure_debut <= heure_fin) {
                dans_plage = (heure_actuelle >= heure_debut && heure_actuelle < heure_fin);
              } else {
                // Plage traversant minuit (ex: 22h à 06h)
                dans_plage = (heure_actuelle >= heure_debut || heure_actuelle < heure_fin);
              }

              if (!dans_plage) {
                charge_autorisee = false;
                ESP_LOGI("REGULATION", "Hors plage horaire solaire (%02dh00 à %02dh00) -> Verrouillage",
                         heure_debut, heure_fin);
              } else {
                charge_autorisee = true;
              }
            } else {
              // Heure non disponible/non synchronisée -> Par sécurité, on autorise la charge
              charge_autorisee = true;
            }
          } else if (au_moins_un_switch_hc_actif) {
            // Filtrage selon le tarif Linky si au moins un switch HC est coché
            if (ltarf.find("HEURE CREUSE") != std::string::npos && ltarf.find("SUPER") == std::string::npos) {
              charge_autorisee = id(hc_standard).state;
            } else if (ltarf.find("HC BLEU") != std::string::npos) {
              charge_autorisee = id(hc_bleu).state;
            } else if (ltarf.find("HC BLANC") != std::string::npos) {
              charge_autorisee = id(hc_blanc).state;
            } else if (ltarf.find("HC ROUGE") != std::string::npos) {
              charge_autorisee = id(hc_rouge).state;
            } else if (ltarf.find("HEURE SUPER CREUSE") != std::string::npos) {
              charge_autorisee = id(hc_super).state;
            } else if (ltarf.find("HC WEEKEND") != std::string::npos || ltarf.find("HC WE") != std::string::npos) {
              charge_autorisee = id(hc_weekend).state;
            } else if (ltarf.find("HC MERCREDI") != std::string::npos) {
              charge_autorisee = id(hc_mercredi).state;
            } else {
              charge_autorisee = false; // Heures Pleines
            }
          }

          if (!charge_autorisee) {
            if (!id(borne_est_verrouillee)) {
              ESP_LOGI("REGULATION", "Charge non autorisée (période/horaire) : Verrouillage de la borne.");
              id(commande_verrou_modbus).make_call().set_value(2).perform();
              id(borne_est_verrouillee) = true;
              id(statut_borne_texte).publish_state("Bloqué");
            }
            if (id(consigne_ampere) != 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }
            return;
          } else {
            if (id(borne_est_verrouillee)) {
              ESP_LOGI("REGULATION", "Charge autorisée : Déverrouillage de la borne.");
              id(commande_verrou_modbus).make_call().set_value(1).perform();
              id(borne_est_verrouillee) = false;

              if ((int)id(etat_borne).state == 5 || (int)id(etat_borne).state == 4) {
                id(consigne_ampere) = 6;
                id(consigne_modbus).make_call().set_value(6.0f).perform();
              }
            }
          }

          // 2. Traitement uniquement si la borne est en charge (Statut 5)
          int statut = (int)id(etat_borne).state;
          if (statut != 5) {
            ESP_LOGI("REGULATION", "Borne non en charge (Statut actuel: %d). Attente...", statut);
            if (id(consigne_ampere) != 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }
            return;
          }

          // 3. Récupération des données TIC Triphasés
          float irms1 = id(tic_irms1).state;
          float irms2 = id(tic_irms2).state;
          float irms3 = id(tic_irms3).state;
          float urms1 = id(tic_urms1).state;
          float urms2 = id(tic_urms2).state;
          float urms3 = id(tic_urms3).state;
          float pcoup_kva = id(tic_pcoup).state;
          float sinsti_va = id(tic_sinsti).state;

          if (std::isnan(urms1) || urms1 <= 0.0f) {
            urms1 = 230.0f;
          }
          
          if (std::isnan(urms2) || urms2 <= 0.0f) {
            urms2 = 230.0f;
          }
          
          if (std::isnan(urms3) || urms3 <= 0.0f) {
            urms3 = 230.0f;
          }

          if (std::isnan(sinsti_va)) {
            sinsti_va = 0.0f;
          }

          float isousc = (pcoup_kva * 1000.0f) / ((urms1+urms2+urms3)/3);

          bool tic_invalide = std::isnan(irms1) || std::isnan(irms2) || std::isnan(irms3);
          bool tic_timeout = (id(derniere_maj_tic) == 0) || ((millis() - id(derniere_maj_tic)) > 60000);

          int val_courant_degrade = (int)id(courant_degrade).state;
          if (val_courant_degrade < 6) val_courant_degrade = 6;

          // --- GESTION DU DÉFAUT / TIMEOUT TIC ---
          if (tic_invalide || tic_timeout) {
            ESP_LOGW("REGULATION", "TIC indisponible ou invalide.");

            if (id(consigne_ampere) > val_courant_degrade) {
              ESP_LOGI("REGULATION", "SÉCURITÉ : Consigne actuelle (%dA) > Courant dégradé (%dA) -> Passage à %dA", 
                       id(consigne_ampere), val_courant_degrade, val_courant_degrade);
              id(consigne_ampere) = val_courant_degrade;
              id(consigne_modbus).make_call().set_value((float)val_courant_degrade).perform();
            } else {
              ESP_LOGI("REGULATION", "SÉCURITÉ : Maintien de la consigne actuelle (%dA), inférieure ou égale au courant dégradé (%dA)", 
                       id(consigne_ampere), val_courant_degrade);
            }
            return;
          }
          
          // --- RECHERCHE DE LA PHASE LA PLUS CHARGÉE ---
          float iinst_max = std::max({irms1, irms2, irms3});

          // --- SÉCURITÉ URGENCE STRICTE : SURCHARGE SEUIL HAUT (IRMS1 >= ISOUSC + 5A) ---
          if (iinst_max >= (isousc + 5.0f)) {
            ESP_LOGW("REGULATION", "SURCHARGE SEUIL HAUT DETECTEE ! (Irms1: %.1fA, Irms2: %.1fA, Irms3: %.1fA, Isousc: %.1fA). Chute immédiate à 6A.", irms1, irms2, irms3, isousc);
            if (id(consigne_ampere) != 6) {
              id(consigne_ampere) = 6;
              id(consigne_modbus).make_call().set_value(6.0f).perform();
            }
            return;
          }

          const int MINIMAL_CHARGE_CURRENT = 6;
          const int MAXIMAL_CHARGE_CURRENT = 32;

          int current_charge = id(consigne_ampere);
          if (current_charge < 6) {
            current_charge = 6;
          }

          // --- LOGIQUE EN MODE CHARGE SOLAIRE ---
          if (mode_solaire_actif) {
            int i_injectee = (int)(sinsti_va / urms1);

            ESP_LOGI("REGULATION", "MODE SOLAIRE | SINSTI=%.0fVA | Urms1=%.1fV | Injection=%dA | Irms1=%.1fA | Consigne=%dA",
                     sinsti_va, urms1, i_injectee, irms1, current_charge);

            if (i_injectee >= 1) {
              ESP_LOGI("REGULATION", "Surplus solaire injecté (%dA) -> Augmentation +1A", i_injectee);
              if (current_charge < MAXIMAL_CHARGE_CURRENT) {
                current_charge += 1;
              }
            } else if (irms1 >= 1.0f) {
              ESP_LOGI("REGULATION", "Soutirage réseau (Irms1=%.1fA) -> Réduction -1A", irms1);
              if (current_charge > MINIMAL_CHARGE_CURRENT) {
                current_charge -= 1;
              }
            } else {
              ESP_LOGI("REGULATION", "Équilibre solaire atteint -> Maintien de la consigne à %dA", current_charge);
            }
          } 
          // --- LOGIQUE EN MODE REGULATION CLASSIQUE (RESEAU) ---
          else {
            float available_current = isousc - iinst_max;

            ESP_LOGI("REGULATION", "MODE RESEAU | LTARF: %s | Irms1=%.1fA | Irms2=%.1fA | Irms3=%.1fA | Isousc=%.1fA | Consigne=%dA | Disponible=%.1fA",
                     ltarf.c_str(), irms1, irms2, irms3, isousc, current_charge, available_current);

            if (available_current < -3.0f) {
              ESP_LOGW("REGULATION", "Dépassement important (dispo: %.1fA) -> Chute à 6A", available_current);
              current_charge = MINIMAL_CHARGE_CURRENT;
            } 
            else if (available_current < -1.0f) {
              ESP_LOGI("REGULATION", "Dépassement modéré (dispo: %.1fA) -> Réduction -1A", available_current);
              if (current_charge > MINIMAL_CHARGE_CURRENT) {
                current_charge -= 1;
              }
            } 
            else if (available_current >= -1.0f && available_current <= 1.0f) {
              ESP_LOGI("REGULATION", "Zone d'équilibre atteinte (dispo: %.1fA) -> Maintien à %dA", available_current, current_charge);
            } 
            else if (available_current > 1.0f && available_current <= 3.0f) {
              ESP_LOGI("REGULATION", "Marge modérée (dispo: %.1fA) -> Augmentation +1A", available_current);
              if (current_charge < MAXIMAL_CHARGE_CURRENT) {
                current_charge += 1;
              }
            } 
            else {
              ESP_LOGI("REGULATION", "Marge importante (dispo: %.1fA) -> Augmentation +2A", available_current);
              if (current_charge < MAXIMAL_CHARGE_CURRENT) {
                current_charge += 2;
              }
            }
          }

          // --- LIMITATIONS ET APLATS ---
          int limite_user = (int)id(courant_limite).state;
          if (current_charge > limite_user) {
            ESP_LOGI("REGULATION", "Consigne plafonnée par la limite utilisateur (%dA)", limite_user);
            current_charge = limite_user;
          }
          if (current_charge > (int)isousc) current_charge = (int)isousc;
          if (current_charge > MAXIMAL_CHARGE_CURRENT) current_charge = MAXIMAL_CHARGE_CURRENT;
          if (current_charge < MINIMAL_CHARGE_CURRENT) current_charge = MINIMAL_CHARGE_CURRENT;

          // Envoi de la consigne uniquement si elle varie
          if (current_charge != id(consigne_ampere)) {
            ESP_LOGI("REGULATION", ">>> APPLICATION NOUVELLE CONSIGNE : %d A <<<", current_charge);
            id(consigne_ampere) = current_charge;
            id(consigne_modbus).make_call().set_value((float)current_charge).perform();
          }

# ==========================================
#  BOUTON DE RESET WI-FI SUR GPIO2
# ==========================================

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: false
      inverted: false
    name: "Bouton Reset Wifi"
    internal: true
    on_press:
      then:
        - lambda: |-
            esphome::wifi::global_wifi_component->save_wifi_sta("", "");
        - button.press: reboot_button

button:
  - platform: restart
    id: reboot_button
    name: "Redémarrer"
    internal: true